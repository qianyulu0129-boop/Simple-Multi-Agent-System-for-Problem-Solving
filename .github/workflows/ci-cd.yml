name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: medical-triage

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest, LLM calls mocked)
        run: pytest -v

  docker:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and hit health endpoint
        run: |
          docker run -d --name app -p 8080:8080 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"ok"'
          curl -fsS http://localhost:8080/api/options

      - name: Show container logs on failure
        if: failure()
        run: docker logs app

  kubernetes:
    name: Deploy to Kubernetes (kind) & smoke-test
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Create throwaway kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Build image and load it into the cluster
        run: |
          docker build -t medical-triage:local .
          kind load docker-image medical-triage:local --name ci

      - name: Apply manifests and wait for rollout
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/medical-triage --timeout=120s
          kubectl get pods -l app=medical-triage -o wide

      - name: Smoke-test through the Service
        run: |
          kubectl port-forward svc/medical-triage 8080:80 > /tmp/pf.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"ok"'

      - name: Scale to 3 replicas and verify
        run: |
          kubectl scale deployment/medical-triage --replicas=3
          kubectl rollout status deployment/medical-triage --timeout=120s
          test "$(kubectl get deployment medical-triage -o jsonpath='{.status.readyReplicas}')" = "3"

      - name: Self-healing check (delete a pod, expect replacement)
        run: |
          POD=$(kubectl get pods -l app=medical-triage -o jsonpath='{.items[0].metadata.name}')
          kubectl delete pod "$POD" --wait=true
          for i in $(seq 1 60); do
            READY=$(kubectl get deployment medical-triage -o jsonpath='{.status.readyReplicas}')
            if [ "$READY" = "3" ]; then echo "Recovered to 3 ready pods"; break; fi
            sleep 2
          done
          kubectl get pods -l app=medical-triage
          test "$(kubectl get deployment medical-triage -o jsonpath='{.status.readyReplicas}')" = "3"
          ! kubectl get pod "$POD" > /dev/null 2>&1

      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get all
          kubectl describe pods -l app=medical-triage
          kubectl logs -l app=medical-triage --tail=50

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [docker, kubernetes]
    # Only deploy from main, and only once GCP is configured (see README "CI/CD").
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO || 'containers' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'medical-triage' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image to Artifact Registry
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA::7}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --timeout 600 \
            --max-instances 2 \
            --set-env-vars "ACTIVE_MODEL_PROFILE=model_3,ACTIVE_PROMPT_SET=default" \
            --set-secrets "PROVIDER_3_API_KEY=provider-3-api-key:latest,PROVIDER_3_BASE_URL=provider-3-base-url:latest"

      - name: Smoke-test deployed service
        run: |
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format 'value(status.url)')
          echo "Deployed to ${URL}"
          curl -fsS "${URL}/api/health"
